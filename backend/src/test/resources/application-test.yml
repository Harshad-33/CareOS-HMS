spring:
  datasource:
    url: jdbc:h2:mem:careos_hms_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.careos.hms: DEBUG

careos:
  security:
    jwt:
      secret: test-only-careos-hms-jwt-signing-key-minimum-32-bytes-long
      issuer: careos-hms-test
      access-token-expiration-seconds: 900
    refresh-token:
      hmac-secret: test-only-careos-hms-refresh-hmac-pepper-minimum-32-bytes
      session-expiration-seconds: 3600
      remember-me-expiration-seconds: 86400
    cookie:
      secure: false
      same-site: Lax
    login:
      bcrypt-strength: 4
      max-failed-attempts: 5
      lockout-duration-minutes: 15
      rate-limit-max-attempts: 100
      rate-limit-window-seconds: 60
    bootstrap:
      enabled: false
