services:
  mysql:
    image: mysql:8.0
    container_name: careos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-careos_hms}
      MYSQL_USER: ${DOCKER_MYSQL_USER:-careos_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${DOCKER_DB_PORT:-3308}:3306"
    volumes:
      - careos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - careos-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: careos-backend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-careos-hms-backend}
      BACKEND_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-careos_hms}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_USE_SSL: ${DB_USE_SSL:-false}
      CORS_ALLOWED_ORIGINS: ${DOCKER_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/database/migrations
    ports:
      - "127.0.0.1:${DOCKER_BACKEND_PORT:-8081}:8080"
    volumes:
      - ./backend/src:/app/src
      - ./database/migrations:/database/migrations
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - careos-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: careos-frontend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCKER_FRONTEND_PORT:-4201}:4200"
    volumes:
      - ./frontend/src:/app/src
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - careos-network

volumes:
  careos_mysql_data:
    name: careos_mysql_data

networks:
  careos-network:
    name: careos-network
    driver: bridge
