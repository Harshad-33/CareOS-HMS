services:
  mysql:
    image: mysql:8.0
    container_name: careos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-careos_hms}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - careos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - careos-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: careos-backend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-careos-hms-backend}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-careos_hms}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_USE_SSL: ${DB_USE_SSL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/database/migrations
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/src:/app/src
      - ./database/migrations:/database/migrations
    networks:
      - careos-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: careos-frontend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - careos-network

volumes:
  careos_mysql_data:
    name: careos_mysql_data

networks:
  careos-network:
    name: careos-network
    driver: bridge
